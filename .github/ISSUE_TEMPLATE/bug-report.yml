name: Bug report
description: Report a crash, false positive, false negative, or invalid measurement.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, private source, payloads, or unreviewed screenshots. Security issues belong in a private advisory.
  - type: input
    id: version
    attributes:
      label: Version
      description: Paste the output of `qa --version`.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and exit code
      description: Replace private paths and URLs with placeholders.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, private paths, payloads, user data, and screenshots.
          required: true
        - label: This is not a security vulnerability.
          required: true
