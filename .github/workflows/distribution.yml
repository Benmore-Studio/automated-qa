name: distribution

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: public-source boundary
        run: |
          if git ls-files | grep -E '(^|/)(agent|benchmarks?|references?|schemas?|tests?)(/|$)|\.(rs|mjs|js|nb|wl|svg|png)$'; then
            echo "private implementation material is tracked in the distribution repository" >&2
            exit 1
          fi
